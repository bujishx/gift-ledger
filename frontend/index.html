<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the device preference before styles/application load to avoid a light flash.
      (function () {
        var mode = 'system';
        try { var saved = localStorage.getItem('gift-ledger-display-theme'); if (['system', 'light', 'dark'].includes(saved)) mode = saved; } catch (_) {}
        var theme = mode === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themeMode = mode;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>往来有礼</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
