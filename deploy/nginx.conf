map $request_uri $giftledger_original_path {
    ~^(?<giftledger_path>[^?]+) $giftledger_path;
    default "-";
}

# Match the normalized URI for API routes and preserve the requested path for SPA navigation.
map $uri $giftledger_access_path {
    ~^/api/v1/imports/[^/]+/(?<giftledger_import_action>(?:confirm|result|issues\.xlsx)/?)$ "/api/v1/imports/{token}/$giftledger_import_action";
    ~^/api/v1/restores/personal/[^/]+/(?<giftledger_restore_action>confirm/?)$ "/api/v1/restores/personal/{token}/$giftledger_restore_action";
    ~^/api/v1/restores/personal/safety-backups/[^/]+(?<giftledger_safety_slash>/?)$ "/api/v1/restores/personal/safety-backups/{token}$giftledger_safety_slash";
    ~^/api/v1/admin/backups/database/[^/]+/(?<giftledger_database_action>download/?)$ "/api/v1/admin/backups/database/{token}/$giftledger_database_action";
    default $giftledger_original_path;
}

# The operations tool correlates its own readiness marker between the web and API logs.
map $request_uri $giftledger_probe_query {
    "~^/api/v1/health/ready\?ops_probe=[0-9a-f]{32}$" "?ops_probe=$arg_ops_probe";
    default "";
}

log_format giftledger_access '$remote_addr - - [$time_local] '
    '"$request_method $giftledger_access_path$giftledger_probe_query $server_protocol" '
    '$status $body_bytes_sent "-" "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log giftledger_access;
    location = /healthz {
        access_log off;
        return 204;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name _;
    access_log /var/log/nginx/access.log giftledger_access;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    rewrite ^/maintenance/?$ /api/v1/maintenance/page last;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
