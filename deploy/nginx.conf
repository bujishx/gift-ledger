# Permit full-length DNS authorities in the site-entry map below.
map_hash_bucket_size 512;

map $request_uri $giftledger_original_path {
    ~^(?<giftledger_path>[^?]+) $giftledger_path;
    default "-";
}

# Match the normalized URI for API routes and preserve the requested path for SPA navigation.
map $uri $giftledger_access_path {
    ~^/api/v1/imports/[^/]+/(?<giftledger_import_action>(?:confirm|result|issues\.xlsx)/?)$ "/api/v1/imports/{token}/$giftledger_import_action";
    ~^/api/v1/restores/personal/[^/]+/(?<giftledger_restore_action>confirm/?)$ "/api/v1/restores/personal/{token}/$giftledger_restore_action";
    ~^/api/v1/restores/personal/safety-backups/[^/]+(?<giftledger_safety_slash>/?)$ "/api/v1/restores/personal/safety-backups/{token}$giftledger_safety_slash";
    ~^/api/v1/admin/backups/database/[^/]+/(?<giftledger_database_action>download/?)$ "/api/v1/admin/backups/database/{token}/$giftledger_database_action";
    default $giftledger_original_path;
}

# The operations tool correlates its own readiness marker between the web and API logs.
map $request_uri $giftledger_probe_query {
    "~^/api/v1/health/ready\?ops_probe=[0-9a-f]{32}$" "?ops_probe=$arg_ops_probe";
    default "";
}

# Host includes the port published on the NAS. The public reverse proxy must supply
# its fixed external authority; forwarding headers from the client do not select an entry.
map $http_host $giftledger_entry {
    default unknown;
    include /tmp/giftledger-authorities.conf;
}

# Empty keys skip accounting. Only the public business login uses these two zones.
map "$giftledger_entry:$request_method:$uri" $giftledger_public_login {
    default "";
    "public:POST:/api/v1/auth/login" site;
    "public:POST:/api/v1/auth/login/" site;
}

geo $giftledger_proxy_peer_ok {
    include /tmp/giftledger-proxy-peer.conf;
}
map $http_x_giftledger_proxy_key $giftledger_proxy_key_ok {
    include /tmp/giftledger-proxy-key.conf;
}
# geo treats a missing or invalid address as 255.255.255.255.
geo $http_x_real_ip $giftledger_client_ip_ok {
    default 1;
    255.255.255.255 0;
}
map "$giftledger_public_login:$giftledger_proxy_peer_ok:$giftledger_proxy_key_ok:$giftledger_client_ip_ok" $giftledger_login_ip {
    default "";
    "site:dedicated:1:1" $http_x_real_ip;
    "site:1:1:1" $http_x_real_ip;
}
map "$giftledger_public_login:$giftledger_proxy_peer_ok:$giftledger_login_ip" $giftledger_unverified_login {
    default 0;
    "site:0:" 1;
    "site:1:" 1;
    "site:dedicated:" 1;
}
limit_req_zone $giftledger_login_ip zone=giftledger_login_ip:1m rate=1r/s;
limit_req_zone $giftledger_public_login zone=giftledger_login_site:64k rate=2r/s;

map $giftledger_entry $giftledger_maintenance_enabled {
    default false;
    lan true;
}

map $uri $giftledger_private_path {
    default 0;
    # The business and owner About dialogs share these two public assets.
    /maintenance/site-info.js 0;
    /maintenance/link-icons.svg 0;
    ~^/maintenance(?:/|$) 1;
    ~^/api/v1/(?:maintenance|admin/backups|backups/personal|restores/personal)(?:/|$) 1;
}

# A proxy that mistakenly sends the NAS authority must not expose the LAN entry.
# A forwarding header can only disqualify a request from that entry, never enable access.
# A configured dedicated proxy peer is also recognizable when it omits every header.
map "$giftledger_proxy_peer_ok:$http_forwarded$http_x_forwarded_for$http_x_forwarded_host$http_x_forwarded_proto$http_x_real_ip$http_x_giftledger_proxy_key" $giftledger_forwarded {
    "unconfigured:" 0;
    "0:" 0;
    "1:" 0;
    default 1;
}

map "$giftledger_entry:$giftledger_forwarded:$giftledger_private_path" $giftledger_reject {
    default 1;
    ~^lan:0: 0;
    ~^public:[01]:0$ 0;
}

log_format giftledger_access '$remote_addr - - [$time_local] '
    '"$request_method $giftledger_access_path$giftledger_probe_query $server_protocol" '
    '$status $body_bytes_sent "-" "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log giftledger_access;
    location = /healthz {
        access_log off;
        return 204;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name _;
    access_log /var/log/nginx/access.log giftledger_access;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;

    if ($giftledger_reject) { return 404; }
    rewrite ^/maintenance/?$ /api/v1/maintenance/page last;

    location = /site-access.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"maintenance":$giftledger_maintenance_enabled}';
    }

    location /api/ {
        default_type application/json;
        if ($giftledger_unverified_login) {
            add_header Cache-Control no-store always;
            return 403 '{"error":{"code":"LOGIN_PROXY_UNVERIFIED","message":"登录来源未能核实，请联系站主检查反向代理设置"}}';
        }
        limit_req zone=giftledger_login_ip burst=2 nodelay;
        limit_req zone=giftledger_login_site burst=2 nodelay;
        limit_req_status 429;
        error_page 429 = @public_login_limit;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-GiftLedger-Proxy-Key "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout;
        proxy_read_timeout 120s;
    }

    location @public_login_limit {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header Cache-Control no-store always;
        return 429 '{"error":{"code":"PUBLIC_LOGIN_RATE_LIMITED","message":"登录请求较多，请稍后再试"}}';
    }

    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
