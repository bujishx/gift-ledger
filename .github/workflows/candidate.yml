name: Isolated acceptance artifact
on:
  push:
    branches: [qa-artifact/owner-1826-bd6a0a3ea0]
permissions:
  contents: read
jobs:
  windows-site-tools:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: bd6a0a3ea0352c6aba7e13f878b1586d8177c6d4
          path: checkout
          persist-credentials: false
      - name: Stage reviewed bytes
        run: python -I checkout/deploy/publication/images.py stage-source checkout reviewed
      - name: Exercise the packaged Windows launcher and local key permissions
        working-directory: reviewed
        run: python -m unittest discover -v -s validation/release -p test_windows_site.py
      - name: Exercise native age setup on Windows
        working-directory: reviewed
        run: python -m unittest discover -v -s validation/release -p test_native_age.py
      - name: Download verified native tools and test offline reuse on Windows
        working-directory: reviewed/validation/release
        env:
          GIFTLEDGER_TEST_NATIVE_DOWNLOAD: '1'
        run: python -m unittest -v test_publication.Tests.test_official_desktop_age_from_packaged_tool
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: reviewed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: bd6a0a3ea0352c6aba7e13f878b1586d8177c6d4
          path: checkout
          persist-credentials: false
      - name: Assemble only the source files reviewed for this commit
        working-directory: .
        run: python3 -I checkout/deploy/publication/images.py stage-source checkout reviewed
      - name: Install OCI, age and release test tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo age python3-pytest
      - name: Offline recovery and backup ownership tests
        run: /usr/bin/python3 -m pytest -q -p no:cacheprovider validation/release
      - name: Build all five Linux/amd64 images
        run: python3 deploy/publication/images.py build "$RUNNER_TEMP/candidate" --commit "bd6a0a3ea0352c6aba7e13f878b1586d8177c6d4"
      - name: Verify key recovery and rotation with the candidate's age binaries
        run: |
          docker run --rm --pull=never --network none --read-only --user 0:0 \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777 \
            --mount "type=bind,source=$PWD,target=/src,readonly" --workdir /src \
            --env PYTHONDONTWRITEBYTECODE=1 --entrypoint /opt/venv/bin/python3.12 \
            giftledger-ci/backup:candidate -m unittest discover -v \
            -s validation/release -p test_key_lifecycle.py
      - name: Backend regression tests against the candidate
        run: |
          docker run --rm --network none -v "$PWD/backend/tests:/app/backend/tests:ro" -e PYTHONPATH=/app/backend --entrypoint /opt/venv/bin/python3.12 giftledger-ci/api:candidate -m pytest -q -p no:cacheprovider /app/backend/tests
      - name: Test fresh installation, trusted HTTPS, enrollment and real backup
        run: sudo python3 deploy/publication/smoke.py
      - name: Upgrade a populated v1.8.1 site and toggle its HTTPS bookkeeping domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.8.1 --repo bujishx/gift-ledger --pattern docker-compose.yml --dir "$RUNNER_TEMP/v181"
          echo "f32fdff28531e94cbfab0d0d98b147e4923cd5ac169011872f5709c6dbaede38  $RUNNER_TEMP/v181/docker-compose.yml" | sha256sum -c -
          sudo python3 deploy/publication/upgrade_smoke.py --from-yaml "$RUNNER_TEMP/v181/docker-compose.yml"
      - name: Verify all five OCI manifests and layer hashes
        run: python3 deploy/publication/images.py verify "$RUNNER_TEMP/candidate" --commit "bd6a0a3ea0352c6aba7e13f878b1586d8177c6d4"
      - name: Retain the tested images for approval
        if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == 'qa-artifact/owner-1826-bd6a0a3ea0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: giftledger-candidate
          path: ${{ runner.temp }}/candidate/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
