name: Candidate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-site-tools:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: checkout
          persist-credentials: false
      - name: Stage reviewed bytes
        run: python -I checkout/deploy/publication/images.py stage-source checkout reviewed
      - name: Exercise the packaged Windows launcher and local key permissions
        working-directory: reviewed
        run: python -m unittest discover -v -s validation/release -p test_windows_site.py
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: reviewed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: checkout
          persist-credentials: false
      - name: Assemble only the source files reviewed for this commit
        working-directory: .
        run: python3 -I checkout/deploy/publication/images.py stage-source checkout reviewed
      - name: Install OCI and age tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends skopeo age
      - name: Offline recovery and backup ownership tests
        run: python3 -m unittest discover -s validation/release -p "test_*.py"
      - name: Build all five Linux/amd64 images
        run: python3 deploy/publication/images.py build "$RUNNER_TEMP/candidate" --commit "$GITHUB_SHA"
      - name: Backend regression tests against the candidate
        run: |
          docker run --rm --network none -v "$PWD/backend/tests:/app/backend/tests:ro" -e PYTHONPATH=/app/backend --entrypoint /opt/venv/bin/python3.12 giftledger-ci/api:candidate -m pytest -q -p no:cacheprovider /app/backend/tests
      - name: Test fresh installation, trusted HTTPS, enrollment and real backup
        run: sudo python3 deploy/publication/smoke.py
      - name: Verify all five OCI manifests and layer hashes
        run: python3 deploy/publication/images.py verify "$RUNNER_TEMP/candidate" --commit "$GITHUB_SHA"
      - name: Retain the tested images for approval
        if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: giftledger-candidate
          path: ${{ runner.temp }}/candidate/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
